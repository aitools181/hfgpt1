[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Conservative pool sizing keeps interactive traffic inside the web container's
; memory budget. Workers are recycled frequently so native/library leaks cannot
; accumulate indefinitely.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200
request_terminate_timeout = 180s
request_slowlog_timeout = 15s
slowlog = /proc/self/fd/2

[control]
user = www-data
group = www-data
listen = 127.0.0.1:9001
listen.allowed_clients = 127.0.0.1
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Dedicated FPM ping/status pool. This is independent of the normal application
; workers, so liveness remains observable even when all interactive workers are
; legitimately busy.
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 20s
pm.max_requests = 200
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
request_terminate_timeout = 10s
php_admin_value[memory_limit] = 32M

[reports]
user = www-data
group = www-data
listen = 127.0.0.1:9002
listen.allowed_clients = 127.0.0.1
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Large CSV exports are isolated from normal page traffic so one long report
; cannot consume the interactive application worker pool.
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 20s
pm.max_requests = 50
request_terminate_timeout = 900s
request_slowlog_timeout = 30s
slowlog = /proc/self/fd/2
php_admin_value[memory_limit] = 160M

[health]
user = www-data
group = www-data
listen = 127.0.0.1:9003
listen.allowed_clients = 127.0.0.1
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
; Dedicated Laravel-bootstrap liveness pool, isolated from interactive traffic.
; It never checks PostgreSQL or Redis; deep readiness remains /health/ready.
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 20s
pm.max_requests = 100
request_terminate_timeout = 15s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
php_admin_value[memory_limit] = 64M
