server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 30m;

    # Send Nginx logs to the container log driver, where Compose rotation caps
    # them. Debian's default file logs can otherwise grow inside the writable
    # container layer until disk exhaustion.
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /__container_health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    # FPM ping is handled by its dedicated status listener on 9001, independent
    # of the normal application worker pool. This prevents false health failures
    # when all application workers are legitimately busy.
    location = /__fpm_health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param REQUEST_URI /fpm-ping;
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 3s;
    }

    # Isolated Laravel bootstrap liveness. This uses a dedicated FPM pool so a
    # busy normal application pool cannot create false health failures. It does
    # not touch PostgreSQL or Redis; deep dependency readiness stays at
    # /health/ready.
    location = /__laravel_health {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
        fastcgi_param QUERY_STRING "";
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass 127.0.0.1:9003;
        fastcgi_connect_timeout 2s;
        fastcgi_read_timeout 5s;
        fastcgi_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /monitoring/reports/export {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param PHP_VALUE "max_execution_time=0";
        fastcgi_pass 127.0.0.1:9002;
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
        fastcgi_buffering off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_connect_timeout 10s;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
