services:
  web:
    build:
      context: .
      target: web
    restart: always
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-1280m}
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 30s
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-SMVS Happy Family}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-5}
      CACHE_STORE: database
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_CONNECTION: pgsql
      SESSION_TABLE: sessions
      SESSION_ENCRYPT: "false"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_QUEUE_BLOCK_FOR: ${REDIS_QUEUE_BLOCK_FOR:-5}
      REDIS_QUEUE_READ_TIMEOUT: ${REDIS_QUEUE_READ_TIMEOUT:-15}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "true"
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-SMVS Super Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      PILOT_DATA: ${PILOT_DATA:-false}
      PILOT_PASSWORD: ${PILOT_PASSWORD:-}
      WEB_WATCHDOG_ENABLED: ${WEB_WATCHDOG_ENABLED:-true}
      WEB_WATCHDOG_URL: ${WEB_WATCHDOG_URL:-http://127.0.0.1/__laravel_health}
      WEB_WATCHDOG_INTERVAL_SECONDS: ${WEB_WATCHDOG_INTERVAL_SECONDS:-15}
      WEB_WATCHDOG_TIMEOUT_SECONDS: ${WEB_WATCHDOG_TIMEOUT_SECONDS:-4}
      WEB_WATCHDOG_FAILURE_THRESHOLD: ${WEB_WATCHDOG_FAILURE_THRESHOLD:-4}
      WEB_WATCHDOG_START_GRACE_SECONDS: ${WEB_WATCHDOG_START_GRACE_SECONDS:-60}
      WEB_PROCESS_RESTART_MAX: ${WEB_PROCESS_RESTART_MAX:-5}
      WEB_PROCESS_RESTART_WINDOW_SECONDS: ${WEB_PROCESS_RESTART_WINDOW_SECONDS:-600}
      WEB_PROCESS_STOP_GRACE_SECONDS: ${WEB_PROCESS_STOP_GRACE_SECONDS:-5}
      WEB_PROCESS_RESTART_BACKOFF_SECONDS: ${WEB_PROCESS_RESTART_BACKOFF_SECONDS:-2}
      WEB_PROCESS_RESTART_MAX_BACKOFF_SECONDS: ${WEB_PROCESS_RESTART_MAX_BACKOFF_SECONDS:-20}
      WEB_INFRA_PROBE_INTERVAL_SECONDS: ${WEB_INFRA_PROBE_INTERVAL_SECONDS:-10}
      WEB_INFRA_PROBE_TIMEOUT_SECONDS: ${WEB_INFRA_PROBE_TIMEOUT_SECONDS:-3}
      WEB_INFRA_PROBE_FAILURE_THRESHOLD: ${WEB_INFRA_PROBE_FAILURE_THRESHOLD:-3}
      RUNTIME_LOG_MAX_BYTES: ${RUNTIME_LOG_MAX_BYTES:-5242880}
      HEALTH_MIN_DISK_FREE_MB: ${HEALTH_MIN_DISK_FREE_MB:-512}
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/happy-family-healthcheck", "web"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    build:
      context: .
      target: app
    restart: always
    init: true
    mem_limit: ${WORKER_MEMORY_LIMIT:-448m}
    pids_limit: ${WORKER_PIDS_LIMIT:-192}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 35s
    command: ["happy-family-background", "worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKGROUND_RESTART_BACKOFF_SECONDS: ${BACKGROUND_RESTART_BACKOFF_SECONDS:-3}
      BACKGROUND_RESTART_MAX_BACKOFF_SECONDS: ${BACKGROUND_RESTART_MAX_BACKOFF_SECONDS:-30}
      BACKGROUND_STABLE_RESET_SECONDS: ${BACKGROUND_STABLE_RESET_SECONDS:-300}
      BACKGROUND_LOG_MAX_BYTES: ${BACKGROUND_LOG_MAX_BYTES:-5242880}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-5}
      CACHE_STORE: database
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_CONNECTION: pgsql
      SESSION_TABLE: sessions
      SESSION_ENCRYPT: "false"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_QUEUE_BLOCK_FOR: ${REDIS_QUEUE_BLOCK_FOR:-5}
      REDIS_QUEUE_READ_TIMEOUT: ${REDIS_QUEUE_READ_TIMEOUT:-15}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/happy-family-healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  scheduler:
    build:
      context: .
      target: app
    restart: always
    init: true
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-192m}
    pids_limit: ${SCHEDULER_PIDS_LIMIT:-128}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 20s
    command: ["happy-family-background", "scheduler"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKGROUND_RESTART_BACKOFF_SECONDS: ${BACKGROUND_RESTART_BACKOFF_SECONDS:-3}
      BACKGROUND_RESTART_MAX_BACKOFF_SECONDS: ${BACKGROUND_RESTART_MAX_BACKOFF_SECONDS:-30}
      BACKGROUND_STABLE_RESET_SECONDS: ${BACKGROUND_STABLE_RESET_SECONDS:-300}
      BACKGROUND_LOG_MAX_BYTES: ${BACKGROUND_LOG_MAX_BYTES:-5242880}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      PGCONNECT_TIMEOUT: ${PGCONNECT_TIMEOUT:-5}
      CACHE_STORE: database
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_CONNECTION: pgsql
      SESSION_TABLE: sessions
      SESSION_ENCRYPT: "false"
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_QUEUE_BLOCK_FOR: ${REDIS_QUEUE_BLOCK_FOR:-5}
      REDIS_QUEUE_READ_TIMEOUT: ${REDIS_QUEUE_READ_TIMEOUT:-15}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
        restart: true
      web:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/happy-family-healthcheck", "scheduler"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    restart: always
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    pids_limit: ${DB_PIDS_LIMIT:-256}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    shm_size: ${DB_SHM_SIZE:-256m}
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-96MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-2MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-120000}
      - -c
      - idle_in_transaction_session_timeout=${POSTGRES_IDLE_TX_TIMEOUT:-60000}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-happy_family}
      POSTGRES_USER: ${DB_USERNAME:-happy_family}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-happy_family} -d ${DB_DATABASE:-happy_family}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:8-alpine
    restart: always
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    pids_limit: ${REDIS_PIDS_LIMIT:-128}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_QUEUE_BLOCK_FOR: ${REDIS_QUEUE_BLOCK_FOR:-5}
      REDIS_QUEUE_READ_TIMEOUT: ${REDIS_QUEUE_READ_TIMEOUT:-15}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-160mb}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy noeviction $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping >/dev/null; else redis-cli ping >/dev/null; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_private:
  app_logs:
