services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "80"
    environment:
      APP_NAME: ${APP_NAME:-SMVS Happy Family}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "true"
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-SMVS Super Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      PILOT_DATA: ${PILOT_DATA:-false}
      PILOT_PASSWORD: ${PILOT_PASSWORD:-}
      WEB_WATCHDOG_ENABLED: ${WEB_WATCHDOG_ENABLED:-true}
      WEB_WATCHDOG_URL: ${WEB_WATCHDOG_URL:-http://127.0.0.1/up}
      WEB_WATCHDOG_INTERVAL_SECONDS: ${WEB_WATCHDOG_INTERVAL_SECONDS:-10}
      WEB_WATCHDOG_TIMEOUT_SECONDS: ${WEB_WATCHDOG_TIMEOUT_SECONDS:-5}
      WEB_WATCHDOG_FAILURE_THRESHOLD: ${WEB_WATCHDOG_FAILURE_THRESHOLD:-3}
      WEB_WATCHDOG_START_GRACE_SECONDS: ${WEB_WATCHDOG_START_GRACE_SECONDS:-30}
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 5 --max-time 8 http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    command: ["php", "artisan", "queue:work", "redis", "--queue=imports,default", "--sleep=2", "--tries=3", "--timeout=900", "--max-jobs=1000", "--max-time=3600"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q 'queue:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
      APP_LOCALE: ${APP_LOCALE:-en}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-happy_family}
      DB_USERNAME: ${DB_USERNAME:-happy_family}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FILESYSTEM_DISK: public
      RUN_MIGRATIONS: "false"
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_private:/var/www/html/storage/app/private
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q 'schedule:work' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-happy_family}
      POSTGRES_USER: ${DB_USERNAME:-happy_family}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-happy_family} -d ${DB_DATABASE:-happy_family}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping >/dev/null; else redis-cli ping >/dev/null; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  app_storage:
  app_private:
