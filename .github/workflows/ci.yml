name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: happy_family_test
          POSTGRES_USER: happy_family
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U happy_family -d happy_family_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Static source integrity
        run: python3 scripts/static_integrity_check.py
      - name: Web watchdog behavior
        run: scripts/test_web_watchdog.sh
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run types:check
      - name: Frontend production build
        run: npm run build
      - name: Laravel tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Cache compilation smoke check
        run: |
          php artisan route:cache
          php artisan config:cache
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config >/dev/null
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.invalid
          DB_PASSWORD: test_password
          SUPER_ADMIN_EMAIL: admin@example.invalid
          SUPER_ADMIN_PASSWORD: test_password_ChangeMe123!
      - name: Build application image
        run: docker build --target app -t happy-family-app:ci .
      - name: Build web image
        run: docker build --target web -t happy-family-web:ci .
      - name: Compose runtime smoke test
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.invalid
          DB_PASSWORD: test_password
          SUPER_ADMIN_EMAIL: admin@example.invalid
          SUPER_ADMIN_PASSWORD: test_password_ChangeMe123!
          REDIS_PASSWORD: test_redis_password
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v --remove-orphans || true; }
          trap cleanup EXIT
          docker compose up -d --build db redis web

          ready=0
          for i in $(seq 1 90); do
            if docker compose exec -T web curl -fsS http://127.0.0.1/health/ready >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=250 web db redis
            exit 1
          fi

          # Verify PID-supervisor -> container exit -> restart policy -> recovery.
          web_id=$(docker compose ps -q web)
          before=$(docker inspect "$web_id" --format '{{.RestartCount}}')
          docker compose exec -T web sh -c 'pkill -TERM php-fpm || true' || true

          recovered=0
          for i in $(seq 1 60); do
            web_id=$(docker compose ps -q web)
            after=$(docker inspect "$web_id" --format '{{.RestartCount}}' 2>/dev/null || echo 0)
            if [ "$after" -gt "$before" ] && docker compose exec -T web curl -fsS http://127.0.0.1/up >/dev/null 2>&1; then
              echo "web auto-restart recovered: restart_count $before -> $after"
              recovered=1
              break
            fi
            sleep 2
          done
          if [ "$recovered" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=250 web db redis
            exit 1
          fi

