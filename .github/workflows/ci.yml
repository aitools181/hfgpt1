name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: happy_family_test
          POSTGRES_USER: happy_family
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U happy_family -d happy_family_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run types:check
      - name: Frontend production build
        run: npm run build
      - name: Laravel tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Cache compilation smoke check
        run: |
          php artisan route:cache
          php artisan config:cache
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config >/dev/null
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.invalid
          DB_PASSWORD: test_password
          SUPER_ADMIN_EMAIL: admin@example.invalid
          SUPER_ADMIN_PASSWORD: test_password_ChangeMe123!
      - name: Build application image
        run: docker build --target app -t happy-family-app:ci .
      - name: Build web image
        run: docker build --target web -t happy-family-web:ci .
