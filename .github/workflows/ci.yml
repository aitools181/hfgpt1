name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: happy_family_test
          POSTGRES_USER: happy_family
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U happy_family -d happy_family_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Static source integrity
        run: python3 scripts/static_integrity_check.py
      - name: Web watchdog behavior
        run: scripts/test_web_watchdog.sh
      - name: Runtime healthcheck behavior
        run: scripts/test_runtime_healthchecks.sh
      - name: Bootstrap fail-fast validation
        run: scripts/test_bootstrap_validation.sh
      - name: Background worker/scheduler self-healing
        run: scripts/test_background_supervisor.sh
      - name: 100k-row streaming import safety
        run: php scripts/test_tabular_streaming.php
      - name: Validate Composer manifest
        run: composer validate --strict --no-check-lock
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run types:check
      - name: Frontend production build
        run: npm run build
      - name: Laravel tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - name: Cache compilation smoke check
        run: |
          php artisan route:cache
          php artisan config:cache
        env:
          APP_ENV: production
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: happy_family_test
          DB_USERNAME: happy_family
          DB_PASSWORD: test_password
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  container-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config >/dev/null
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.invalid
          DB_PASSWORD: test_password
          SUPER_ADMIN_EMAIL: admin@example.invalid
          SUPER_ADMIN_PASSWORD: test_password_ChangeMe123!
      - name: Build application image
        run: docker build --target app -t happy-family-app:ci .
      - name: Build web image
        run: docker build --target web -t happy-family-web:ci .
      - name: Compose runtime smoke test
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.invalid
          DB_PASSWORD: test_password
          SUPER_ADMIN_EMAIL: admin@example.invalid
          SUPER_ADMIN_PASSWORD: test_password_ChangeMe123!
          REDIS_PASSWORD: test_redis_password
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v --remove-orphans || true; }
          trap cleanup EXIT
          docker compose up -d --build db redis web

          ready=0
          for i in $(seq 1 90); do
            if docker compose exec -T web curl -fsS http://127.0.0.1/health/ready >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=250 web db redis
            exit 1
          fi

          # Start background services too and verify their init:true-aware health checks.
          docker compose up -d worker scheduler
          background_healthy=0
          for i in $(seq 1 45); do
            worker_status=$(docker inspect "$(docker compose ps -q worker)" --format '{{.State.Health.Status}}' 2>/dev/null || true)
            scheduler_status=$(docker inspect "$(docker compose ps -q scheduler)" --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$worker_status" = healthy ] && [ "$scheduler_status" = healthy ]; then
              echo "worker and scheduler healthchecks are healthy"
              background_healthy=1
              break
            fi
            sleep 2
          done
          if [ "$background_healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=250 worker scheduler
            exit 1
          fi

          # A queue/scheduler child exit must be recovered inside the same
          # container. This prevents intentional queue recycling or transient
          # dependency errors from presenting as a stopped Compose service.
          for service in worker scheduler; do
            service_id=$(docker compose ps -q "$service")
            restart_before_bg=$(docker inspect "$service_id" --format '{{.RestartCount}}')
            old_child=$(docker compose exec -T "$service" cat "/run/happy-family/$service.pid" | tr -d '\r')
            docker compose exec -T "$service" sh -c "kill -KILL \$(cat /run/happy-family/$service.pid)" || true
            child_recovered=0
            for i in $(seq 1 45); do
              new_child=$(docker compose exec -T "$service" cat "/run/happy-family/$service.pid" 2>/dev/null | tr -d '\r' || true)
              restart_now_bg=$(docker inspect "$service_id" --format '{{.RestartCount}}' 2>/dev/null || echo -1)
              if [ -n "$new_child" ] && [ "$new_child" != "$old_child" ] && [ "$restart_now_bg" = "$restart_before_bg" ] && docker compose exec -T "$service" /usr/local/bin/happy-family-healthcheck "$service" >/dev/null 2>&1; then
                echo "$service child recovered in-container: $old_child -> $new_child"
                child_recovered=1
                break
              fi
              sleep 2
            done
            if [ "$child_recovered" -ne 1 ]; then
              docker compose ps
              docker compose logs --no-color --tail=250 "$service"
              exit 1
            fi
          done

          # Redis is queue-only for web availability. Stopping Redis must not
          # make the web liveness probe fail or restart the web container.
          web_id_before_redis=$(docker compose ps -q web)
          web_restarts_before_redis=$(docker inspect "$web_id_before_redis" --format '{{.RestartCount}}')
          docker compose stop redis
          sleep 3
          docker compose exec -T web /usr/local/bin/happy-family-healthcheck web
          docker compose exec -T web curl -fsS http://127.0.0.1/health/live >/dev/null
          web_restarts_after_redis=$(docker inspect "$web_id_before_redis" --format '{{.RestartCount}}')
          test "$web_restarts_after_redis" = "$web_restarts_before_redis"
          docker compose start redis
          redis_healthy=0
          for i in $(seq 1 30); do
            redis_status=$(docker inspect "$(docker compose ps -q redis)" --format '{{.State.Health.Status}}' 2>/dev/null || true)
            if [ "$redis_status" = healthy ]; then redis_healthy=1; break; fi
            sleep 1
          done
          test "$redis_healthy" -eq 1

          # A single PHP-FPM master crash must recover inside the same web
          # container without a public outage or Docker-level restart.
          web_id=$(docker compose ps -q web)
          restart_before=$(docker inspect "$web_id" --format '{{.RestartCount}}')
          old_fpm_pid=$(docker compose exec -T web cat /run/happy-family/php-fpm.pid | tr -d '\r')
          docker compose exec -T web sh -c 'kill -KILL "$(cat /run/happy-family/php-fpm.pid)"' || true

          in_container_recovered=0
          for i in $(seq 1 45); do
            new_fpm_pid=$(docker compose exec -T web cat /run/happy-family/php-fpm.pid 2>/dev/null | tr -d '\r' || true)
            restart_now=$(docker inspect "$web_id" --format '{{.RestartCount}}' 2>/dev/null || echo -1)
            if [ -n "$new_fpm_pid" ] && [ "$new_fpm_pid" != "$old_fpm_pid" ] && [ "$restart_now" = "$restart_before" ] && docker compose exec -T web /usr/local/bin/happy-family-healthcheck web >/dev/null 2>&1; then
              echo "PHP-FPM recovered inside web container: pid $old_fpm_pid -> $new_fpm_pid"
              in_container_recovered=1
              break
            fi
            sleep 2
          done
          if [ "$in_container_recovered" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=300 web
            exit 1
          fi

          # Exhaust the bounded in-container recovery budget. The supervisor
          # must then exit and Docker restart:always must bring the service back.
          for crash in $(seq 2 6); do
            current_id=$(docker compose ps -q web)
            [ "$current_id" = "$web_id" ] || break
            current_pid=$(docker compose exec -T web cat /run/happy-family/php-fpm.pid 2>/dev/null | tr -d '\r' || true)
            [ -n "$current_pid" ] || break
            docker compose exec -T web sh -c 'kill -KILL "$(cat /run/happy-family/php-fpm.pid)"' || true
            if [ "$crash" -lt 6 ]; then
              for i in $(seq 1 30); do
                next_pid=$(docker compose exec -T web cat /run/happy-family/php-fpm.pid 2>/dev/null | tr -d '\r' || true)
                [ -n "$next_pid" ] && [ "$next_pid" != "$current_pid" ] && break
                sleep 1
              done
            fi
          done

          docker_recovered=0
          for i in $(seq 1 90); do
            web_id_now=$(docker compose ps -q web)
            restart_after=$(docker inspect "$web_id_now" --format '{{.RestartCount}}' 2>/dev/null || echo 0)
            if [ "$restart_after" -gt "$restart_before" ] && docker compose exec -T web /usr/local/bin/happy-family-healthcheck web >/dev/null 2>&1; then
              echo "Docker auto-restart recovered web: restart_count $restart_before -> $restart_after"
              docker_recovered=1
              break
            fi
            sleep 2
          done
          if [ "$docker_recovered" -ne 1 ]; then
            docker compose ps
            docker compose logs --no-color --tail=350 web db redis
            exit 1
          fi

